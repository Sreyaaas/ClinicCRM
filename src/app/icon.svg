<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="nadi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8.5" fill="url(#nadi-grad)" />

  <!-- Subtle Inner Top Highlight -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="none" stroke="url(#shine)" stroke-width="1" />

  <!-- Nadi ECG Pulse Rhythm Line -->
  <path
    d="M 5 16 H 10.2 L 12.5 10.2 L 16.5 21.8 L 19.8 13.2 L 21.6 16 H 27"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
